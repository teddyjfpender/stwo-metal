[package]
name = "stwo-air-utils"
version = "2.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Utility functions for AIR (Algebraic Intermediate Representation) in STWO"

[workspace]
members = []

[dependencies]
bytemuck = { version = "1.14.3", default-features = false }
itertools = { version = "0.12", default-features = false, features = ["use_alloc"] }
rayon = { version = "1.10.0", optional = false }
stwo = { path = "../stwo", version = "2.1.0", features = ["prover"] }
stwo-air-utils-derive = { path = "../air-utils-derive", version = "2.1.0" }

[lib]
bench = false

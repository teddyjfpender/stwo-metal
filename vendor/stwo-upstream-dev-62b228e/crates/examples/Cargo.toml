[package]
name = "stwo-examples"
version = "2.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Pinned upstream STWO example implementations for stwo-metal acceptance work"

[features]
parallel = ["dep:rayon", "stwo/parallel"]
tracing = ["stwo/tracing"]
slow-tests = []

[lib]
bench = false

[dependencies]
rayon = { version = "1.10.0", optional = true }
num-traits = { version = "0.2.19", default-features = false }
itertools = { version = "0.12", default-features = false, features = ["use_alloc"] }
tracing = { version = "0.1.40", default-features = false }
tracing-subscriber = { version = "0.3.18", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
rand = { version = "0.8.5", default-features = false, features = ["small_rng"] }
educe = "0.5.0"
stwo = { path = "../stwo", version = "2.1.0", default-features = false, features = ["prover"] }
stwo-constraint-framework = { path = "../constraint-framework", version = "2.1.0", default-features = false, features = ["prover", "parallel"] }

[dev-dependencies]
criterion = { default-features = false, features = ["html_reports"], version = "0.5.1" }
ndarray = "0.16.1"
test-log = { version = "0.2.15", features = ["trace"] }

[[bench]]
harness = false
name = "poseidon"
